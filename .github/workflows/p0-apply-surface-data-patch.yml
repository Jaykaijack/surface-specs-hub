name: p0-apply-surface-data-patch
on:
  workflow_dispatch:
  push:
    branches: [fix/p0-spec-verification-20260922]
    paths:
      - 'docs/p0-surface-data.patch.b64'
      - 'docs/batch1-surface-data.patch.b64'
      - 'docs/batch2-surface-data.patch.b64'
      - 'docs/batch3-surface-data.patch.b64'
      - '.github/workflows/p0-apply-surface-data-patch.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0-spec-verification-20260922
          fetch-depth: 0
      - name: Restore base then apply P0 + batch1 + batch2 + batch3 patches
        run: |
          set -euo pipefail
          BASE_COMMIT=3374f26dc26dc1fc33c8b2eaef0b11ee023940f7
          git show "${BASE_COMMIT}:js/surface-data.js" > js/surface-data.js
          base64 -d docs/p0-surface-data.patch.b64 > /tmp/p0-surface-data.patch
          patch -p1 < /tmp/p0-surface-data.patch
          if [ -f docs/batch1-surface-data.patch.b64 ]; then
            base64 -d docs/batch1-surface-data.patch.b64 > /tmp/batch1-surface-data.patch
            patch -p1 < /tmp/batch1-surface-data.patch
          fi
          if [ -f docs/batch2-surface-data.patch.b64 ]; then
            base64 -d docs/batch2-surface-data.patch.b64 > /tmp/batch2-surface-data.patch
            patch -p1 < /tmp/batch2-surface-data.patch
          fi
          if [ -f docs/batch3-surface-data.patch.b64 ]; then
            base64 -d docs/batch3-surface-data.patch.b64 > /tmp/batch3-surface-data.patch
            patch -p1 < /tmp/batch3-surface-data.patch
          fi
          grep -q '3270' js/surface-data.js
          grep -q '47 Wh' js/surface-data.js
          grep -q '6,788' js/surface-data.js
          grep -q '9,788' js/surface-data.js
          grep -q '14,488' js/surface-data.js
          grep -q '40/48 TOPS' js/surface-data.js
          grep -q 'LCD 额定 53 Wh / OLED 额定 47 Wh' js/surface-data.js
          grep -q '16.70 Wh 额定' js/surface-data.js
          grep -q '微软公开口径冲突' js/surface-data.js
          grep -q '72.8 Wh' js/surface-data.js
          test "$(grep -c '85.4 Wh（顶盖 23.2 Wh + GPU 底座 62.2 Wh' js/surface-data.js)" -eq 2
          grep -q '13.5 Wh 额定' js/surface-data.js
          grep -q '85 英寸 3840 × 2160' js/surface-data.js
          grep -q '26.77 Wh' js/surface-data.js
          grep -q '39.47 Wh' js/surface-data.js
          grep -q 'i5-8350U / i7-8650U（15 英寸官方配置）' js/surface-data.js
          grep -q '71.66 Wh' js/surface-data.js
          grep -q 'i5-6440HQ / i7-6820HQ' js/surface-data.js
          grep -q 'i3-1115G4 / i5-1145G7 / i7-1185G7（商用版）' js/surface-data.js
      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/surface-data.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: align Surface specs through batch3 with Microsoft public sources"
          git push origin HEAD:fix/p0-spec-verification-20260922
