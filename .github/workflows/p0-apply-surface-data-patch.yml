name: p0-apply-surface-data-patch
on:
  workflow_dispatch:
  push:
    branches: [fix/p0-spec-verification-20260922]
    paths:
      - 'docs/ban-A52-surface-data.patch.b64'
      - 'docs/full-library-verification-registry.json.gz.b64'
      - '.github/workflows/p0-apply-surface-data-patch.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0-spec-verification-20260922
          fetch-depth: 0
      - name: Apply A52 patch + repair registry.gz.b64 + decode
        run: |
          set -euo pipefail
          echo "Applying ban-A52 patch onto checked-out js/surface-data.js"
          base64 -d docs/ban-A52-surface-data.patch.b64 | gzip -d > /tmp/ban-A52-surface-data.patch
          patch -p1 --verbose < /tmp/ban-A52-surface-data.patch
          echo "Repair known 2-char corruption in registry.gz.b64 (MCP upload artifact)"
          python3 <<'PY'
          from pathlib import Path
          p = Path('docs/full-library-verification-registry.json.gz.b64')
          s = list(p.read_text())
          # Known corruptions from upload: pos 2489 C->c, pos 11616 Z->T
          assert s[2489] in ('C','c'), s[2489]
          assert s[11616] in ('Z','T'), s[11616]
          s[2489] = 'c'
          s[11616] = 'T'
          p.write_text(''.join(s))
          PY
          base64 -d docs/full-library-verification-registry.json.gz.b64 | gzip -d > docs/full-library-verification-registry.json
          sha256sum js/surface-data.js docs/full-library-verification-registry.json docs/full-library-verification-registry.json.gz.b64
      - name: Verify exact data and registry outputs
        run: |
          set -euo pipefail
          echo 'ba24ebb9d0765e2c2e7d41c99427884e1e0e1a092eb48e48f15b2648dd8a7244  js/surface-data.js' | sha256sum -c -
          echo 'e989ead3e6f603f47ddffdda72ffad2f0351b32a527751b8f7773ba01af4ac58  docs/full-library-verification-registry.json' | sha256sum -c -
          node <<'NODE'
          const data = require('./js/surface-data.js');
          const registry = require('./docs/full-library-verification-registry.json');
          if (data.devices.length !== 64) throw new Error('expected 64 devices');
          if (registry.entries.length !== 576) throw new Error('expected 576 registry entries');
          const expected = { VERIFIED: 437, POLICY_SAFE_NOT_DISCLOSED: 43, POLICY_SAFE_NOT_APPLICABLE: 39, POLICY_SAFE_PRICE_UNAVAILABLE: 57, PENDING: 0 };
          for (const [key, value] of Object.entries(expected)) {
            const got = registry.verdictCounts[key] || 0;
            if (got !== value) throw new Error(`${key}: ${got} != ${value}`);
          }
          for (const entry of registry.entries) {
            if (!entry.deviceId || !entry.field || !entry.verdict || !entry.sourceUrl) throw new Error('incomplete');
            if (['PENDING','MISMATCH','UNREVIEWED','BAD_URL'].includes(entry.verdict)) throw new Error(entry.verdict);
            if (String(entry.verdict).startsWith('POLICY_SAFE') && !entry.reason) throw new Error('no reason');
          }
          console.log('OK', registry.verdictCounts);
          NODE
      - name: Commit and push generated outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/surface-data.js docs/full-library-verification-registry.json docs/full-library-verification-registry.json.gz.b64
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "fix: close A52 BAN items — full-library VERIFIED/POLICY_SAFE 576"
          git push origin HEAD:fix/p0-spec-verification-20260922
