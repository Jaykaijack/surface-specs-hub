name: p0-apply-surface-data-patch
on:
  workflow_dispatch:
  push:
    branches: [fix/p0-spec-verification-20260922]
    paths:
      - 'docs/p0-surface-data.patch'
      - '.github/workflows/p0-apply-surface-data-patch.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0-spec-verification-20260922
          fetch-depth: 0
      - name: Restore base then apply P0 patch
        run: |
          set -euo pipefail
          BASE_COMMIT=3374f26dc26dc1fc33c8b2eaef0b11ee023940f7
          git show "${BASE_COMMIT}:js/surface-data.js" > js/surface-data.js
          patch -p1 < docs/p0-surface-data.patch
          # sanity: must contain P0 markers
          grep -q '3270 × 2180' js/surface-data.js
          grep -q 'LCD 额定 47 Wh' js/surface-data.js
          grep -q '¥6,788' js/surface-data.js
      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/surface-data.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: align P0 Surface specs with Microsoft public sources"
          git push origin HEAD:fix/p0-spec-verification-20260922
